<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Track — VELORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
</head>
<body>
  <div id="chrome-header"></div>
  <main class="wrap sec">
    <h1>Live trip</h1>
    <div id="info" class="panel"></div>
    <div id="map" style="height:360px;border-radius:20px;margin-top:16px"></div>
  </main>
  <div id="chrome-footer"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/js/core.js"></script>
  <script>
    document.getElementById("chrome-header").innerHTML = headerHTML();
    document.getElementById("chrome-footer").innerHTML = footerHTML();
    bindChrome();
    const id = new URLSearchParams(location.search).get("id");
    VELORA.get("/api/bookings/" + encodeURIComponent(id)).then((b) => {
      const eta = 7;
      document.getElementById("info").innerHTML = `
        <p class="xl">Your driver is ${eta} minutes away.</p>
        <p>${b.pickup.name} → ${b.dest.name}</p>
        ${b.driver ? `<p>${b.driver.first} ★ ${b.driver.rating} · ${b.driver.model || ""} ${b.driver.plate || ""}</p>` : `<p>Searching for a driver. You booked before assignment — that is expected.</p>`}
        <p>OTP ${b.otp}</p>
        <a class="btn btn-g" href="tel:+886910000000">Call driver</a>
        <a class="btn btn-g" href="/help.html">Message / Support</a>`;
      const map = L.map("map").setView([b.pickup.lat, b.pickup.lng], 11);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OSM" }).addTo(map);
      L.marker([b.pickup.lat, b.pickup.lng]).addTo(map).bindPopup("Pickup");
      L.marker([b.dest.lat, b.dest.lng]).addTo(map).bindPopup("Destination");
      L.polyline([[b.pickup.lat, b.pickup.lng], [b.dest.lat, b.dest.lng]], { color: "#1f4e46" }).addTo(map);
    }).catch(() => { document.getElementById("info").textContent = "Trip not found."; });
  </script>
</body>
</html>
