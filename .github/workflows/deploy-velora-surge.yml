name: Deploy VELORA to Surge

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "velora/**"
      - ".github/workflows/deploy-velora-surge.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Surge
        run: npm install -g surge
      - name: Publish public demo URL
        working-directory: velora
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: surge . velora-private-rides.surge.sh --token "$SURGE_TOKEN"
