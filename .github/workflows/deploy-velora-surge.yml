name: Deploy VELORA to Surge

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "velora/**"
      - ".github/workflows/deploy-velora-surge.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Surge (optional)
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "SURGE_TOKEN not set — skipping Surge deploy."
            echo "Use GitHub Pages (gh-pages branch) or add SURGE_TOKEN to repo secrets."
            exit 0
          fi
          npm install -g surge
          cd velora
          python3 <<'PY'
          import json
          from catalog import *
          from pathlib import Path
          cat = {
              "classes": CLASSES, "operators": OPERATORS, "locations": LOCATIONS,
              "popular": POPULAR, "extras": EXTRAS, "reviews": REVIEWS, "faq": FAQ,
              "help": HELP, "promos": list(PROMOS.keys()),
              "promo_shelf": [{"code": k, **v} for k, v in PROMOS.items()],
              "fleet_os": FLEET_OS_URL, "secondary_nav": SECONDARY_NAV,
              "service_tabs": SERVICE_TABS, "regions": REGIONS, "destinations": DESTINATIONS,
              "benefits": BENEFITS, "how_to_book": HOW_TO_BOOK, "favorites": FAVORITES,
              "trending": TRENDING, "channels": CHANNELS,
              "pricing": PRICING,
              "fixed_routes": {f"{a}|{b}": v for (a, b), v in FIXED_ROUTES.items()},
              "fx": FX, "symbols": SYMBOL,
          }
          Path("data/catalog.json").write_text(json.dumps(cat, ensure_ascii=False, indent=2))
          PY
          surge . velora-private-rides.surge.sh --token "$SURGE_TOKEN"
