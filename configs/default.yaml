# MR-AVT default hyperparameters matching the Speech Communication manuscript.
seed: 42
dataset: iemocap
data_root: data
num_classes: 4
sample_rate: 16000
n_mels: 64
max_audio_seconds: 8.0
num_visual_frames: 16
image_size: 224
temporal_frames: 80

resolutions:
  s:
    win_length: 400
    hop_length: 160
    n_fft: 512
  m:
    win_length: 1600
    hop_length: 400
    n_fft: 2048
  l:
    win_length: 8000
    hop_length: 1600
    n_fft: 8192

model:
  dim: 768
  depth: 6
  heads: 8
  ffn_dim: 3072
  dropout: 0.1
  graph_layers: 2
  graph_heads: 8
  graph_k: 8
  graph_tau: 0.5
  eta: 0.1
  gate_delta: 0.5
  contrastive_tau: 0.07
  graph_token_limit: 32
  use_pretrained_vit: false

train:
  epochs: 100
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  patience: 10
  lambda_cls: 1.0
  lambda_con: 0.5
  lambda_aug: 0.5
  lambda_cm: 0.1
  lambda_align: 0.1
  lambda_gate: 0.05
  num_workers: 4
  grad_clip: 1.0

eval:
  metric: wa
  snr_db: [20, 10, 5, 0]
  visual_dropout: [0.0, 0.25, 0.50, 0.75]
