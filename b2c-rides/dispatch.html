<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RideLook Fleet OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/assets/css/klook.css"/>
  <style>
    #fmap { height: 280px; border-radius: 12px; margin: 12px 0; }
    #phoneForm input, #phoneForm select { display: block; width: 100%; margin: 6px 0; padding: 8px; border-radius: 8px; border: 1px solid #2a3a5c; background: #0f1728; color: #fff; }
  </style>
</head>
<body>
  <div class="fleet">
    <aside class="side">
      <a class="logo" href="/" style="margin-bottom:16px"><span class="mark">R</span> Fleet OS</a>
      <a class="on" href="/dispatch.html">Dashboard</a>
      <a href="/web.html">Website</a>
      <a href="/app.html">Guest app</a>
      <a href="/driver.html">Driver</a>
      <button id="reset" type="button">Reset demo</button>
      <button id="langBtn" type="button">繁中 / EN</button>
    </aside>
    <main class="main">
      <h2>RideLook Taiwan dispatch</h2>
      <p class="sub" style="color:#9aa6bf">Jobs from website + app + phone book-ins · currency TWD</p>
      <div class="kpis" id="kpis"></div>
      <div id="fmap"></div>
      <div style="display:grid;grid-template-columns:1.4fr .8fr;gap:14px">
        <div>
          <h3>Jobs</h3>
          <div id="jobs"></div>
        </div>
        <div>
          <form id="phoneForm"></form>
          <h3>Drivers</h3>
          <div id="drivers"></div>
          <h3>Alerts</h3>
          <div id="alerts"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/dispatch.js"></script>
</body>
</html>
