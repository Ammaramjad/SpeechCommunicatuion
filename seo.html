<!DOCTYPE html>
<html lang="en">
<head>
  <script src="assets/js/hosting.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Airport transfers in Taipei — VELORA</title>
  <meta name="description" content="Private airport transfers from Taoyuan International Airport (TPE) to Taipei with professional drivers."/>
  <link rel="canonical" href="/airport-transfer/taiwan/tpe-taoyuan-airport"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
</head>
<body>
  <div id="chrome-header"></div>
  <main class="wrap sec">
    <h1>Airport transfers in Taipei</h1>
    <p class="sub">Taoyuan International Airport (TPE) to the city, Xinyi, hotels and Jiufen. Starting prices from the live catalog.</p>
    <p><a class="btn btn-p" href="/results.html?service=airport&pickup_id=tpe&dest_id=taipei-101">Book TPE → Taipei 101</a></p>
    <div id="faq" class="acc"></div>
  </main>
  <div id="chrome-footer"></div>
  <script src="/assets/js/demo-api.js"></script>
  <script src="/assets/js/core.js"></script>
  <script>
    document.getElementById("chrome-header").innerHTML = headerHTML();
    document.getElementById("chrome-footer").innerHTML = footerHTML();
    bindChrome();
    VELORA.get("/api/catalog").then((c) => {
      document.getElementById("faq").innerHTML = c.faq.map((f) => `<details><summary>${f.q}</summary><p class="sub">${f.a}</p></details>`).join("");
    });
  </script>
</body>
</html>
